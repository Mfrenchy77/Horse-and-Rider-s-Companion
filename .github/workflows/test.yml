name: App and backend tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: python3 tool/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage
          path: coverage/
      - name: Validate web build config
        run: |
          python3 -c "import json; cfg = json.load(open('web_build_config.json')); assert cfg.get('DICTIONARY_RECAPTCHA_SITE_KEY', '').strip(), 'Missing DICTIONARY_RECAPTCHA_SITE_KEY'; assert cfg.get('ENABLE_CURRICULUM_PUBLISHING') == 'true', 'ENABLE_CURRICULUM_PUBLISHING must be true'"
      - name: Compile production web app
        run: >-
          flutter build web --release --wasm --no-pub
          --dart-define-from-file=web_build_config.json
