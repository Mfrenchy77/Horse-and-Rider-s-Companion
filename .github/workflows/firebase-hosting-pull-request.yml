name: Deploy to Firebase Hosting on PR
'on': pull_request
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --no-pub
      - name: Validate web build config
        run: |
          python3 -c "import json; cfg = json.load(open('web_build_config.json')); assert cfg.get('DICTIONARY_RECAPTCHA_SITE_KEY', '').strip(), 'Missing DICTIONARY_RECAPTCHA_SITE_KEY'; assert cfg.get('ENABLE_CURRICULUM_PUBLISHING') == 'true', 'ENABLE_CURRICULUM_PUBLISHING must be true'"
      - name: Compile production web app
        run: >-
          flutter build web --release --wasm --no-pub
          --dart-define-from-file=web_build_config.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: >-
            ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HORSE_AND_RIDERS_COMPANI_D2BD4
            }}
          projectId: horse-and-riders-compani-d2bd4
