environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  cache:
    path: ../cache
  cloud_firestore: ^7.1.0
  equatable: ^2.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_remote_config: ^7.0.1
