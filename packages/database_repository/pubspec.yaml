  flutter:
    sdk: flutter 
  html: ^0.15.7
  http: ^1.6.0  
  image_picker: ^1.2.4
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
